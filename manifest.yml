resources:
  - key: main
    path: static/frontend/build
    tunnel:
      port: 3000

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - manage:jira-project
    - read:jira-user
  content:
    styles:
      - "unsafe-inline"

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/dc27307e-2495-4129-a72f-0aca7fe3749c
  storage:
    entities:
      - name: audit_log
        attributes:
          timestamp:
            type: string
          accountId:
            type: string
          action:
            type: string
          projectId:
            type: string
          slotKey:
            type: string
          oldValue:
            type: string
          newValue:
            type: string
        indexes:
          - name: by-timestamp
            range:
              - timestamp
          - name: by-project
            range:
              - projectId
