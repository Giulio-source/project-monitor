modules:
  jira:globalPage:
    - key: project-monitor-page
      resource: main
      resolver:
        function: resolver
      title: Project Monitor
      layout: blank
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/frontend/build
    tunnel:
      port: 3000
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - manage:jira-project
  content:
    styles:
      - "unsafe-inline"
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/7b4f151c-c1cd-4ffa-8966-e948977bad1c
